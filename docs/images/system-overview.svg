<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">信号分离与相位反馈总体方案</title>
  <desc id="desc">独立加法器将 A 与 B 合成为 C。分离装置从 C 识别频率与波形，控制两片 DDS 生成输出，再采集内部输出反馈校正相位。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536577"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176b9b"/></marker>
    <style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183044}.h{font-size:28px;font-weight:700}.t{font-size:20px;font-weight:600}.s{font-size:17px}.muted{fill:#536577}.box{fill:#fff;stroke:#c9d5df;stroke-width:1.5}.line{fill:none;stroke:#536577;stroke-width:2;marker-end:url(#arrow)}.feedback{fill:none;stroke:#176b9b;stroke-width:2.5;marker-end:url(#blueArrow)}</style>
  </defs>
  <rect width="1200" height="680" fill="#f7f9fb"/>
  <text x="40" y="52" class="h">从混合信号识别，到双路波形重建</text>
  <text x="40" y="84" class="s muted">2023 电赛 H 题 · STM32G474 / FFT / 双 AD9833 / 相位反馈</text>
  <rect x="30" y="116" width="260" height="424" rx="14" fill="#edf1f5"/>
  <text x="50" y="150" class="t">信号源与独立加法器</text>
  <text x="50" y="177" class="s muted">20–100 kHz · fA &lt; fB</text>
  <rect x="52" y="218" width="92" height="66" rx="8" class="box"/>
  <text x="98" y="245" text-anchor="middle" class="t">A</text><text x="98" y="270" text-anchor="middle" class="s">1 Vpp</text>
  <rect x="52" y="332" width="92" height="66" rx="8" class="box"/>
  <text x="98" y="359" text-anchor="middle" class="t">B</text><text x="98" y="384" text-anchor="middle" class="s">1 Vpp</text>
  <rect x="188" y="272" width="78" height="72" rx="8" class="box"/>
  <text x="227" y="304" text-anchor="middle" class="t">加法器</text><text x="227" y="329" text-anchor="middle" class="s">增益 1</text>
  <path d="M144 251H164V291H186" class="line"/><path d="M144 365H164V325H186" class="line"/>
  <text x="52" y="459" class="s muted">只有 C 与地线接入分离装置</text>
  <text x="52" y="488" class="s muted">不读取原始 A、B 参数</text>
  <rect x="320" y="116" width="850" height="424" rx="14" fill="#fff" stroke="#c9d5df" stroke-dasharray="7 5"/>
  <text x="342" y="150" class="t">分离装置</text>
  <rect x="344" y="270" width="150" height="96" rx="9" class="box"/>
  <text x="419" y="300" text-anchor="middle" class="t">输入调理 / ADC</text>
  <text x="419" y="326" text-anchor="middle" class="s muted">定时触发 + DMA</text><text x="419" y="351" text-anchor="middle" class="s muted">每通道 2048 点</text>
  <path d="M266 308H342" class="line"/><text x="286" y="294" class="s">C</text>
  <rect x="530" y="249" width="232" height="140" rx="9" fill="#eaf3f8" stroke="#176b9b"/>
  <text x="646" y="279" text-anchor="middle" class="t">STM32G474</text>
  <text x="646" y="309" text-anchor="middle" class="s">FFT → 两路频率</text>
  <text x="646" y="337" text-anchor="middle" class="s">三 / 五次谐波 → 波形</text>
  <text x="646" y="365" text-anchor="middle" class="s">相位误差 → DDS 校正</text>
  <path d="M494 318H528" class="line"/>
  <rect x="808" y="220" width="146" height="72" rx="9" class="box"/>
  <text x="881" y="249" text-anchor="middle" class="t">AD9833 · A</text><text x="881" y="275" text-anchor="middle" class="s muted">低频 / 波形 / 相位</text>
  <rect x="808" y="348" width="146" height="72" rx="9" class="box"/>
  <text x="881" y="377" text-anchor="middle" class="t">AD9833 · B</text><text x="881" y="403" text-anchor="middle" class="s muted">高频 / 波形 / 相位</text>
  <path d="M762 290H785V256H806" class="line"/><path d="M762 350H785V384H806" class="line"/>
  <rect x="993" y="220" width="114" height="72" rx="9" class="box"/><rect x="993" y="348" width="114" height="72" rx="9" class="box"/>
  <text x="1050" y="249" text-anchor="middle" class="t">输出调理</text><text x="1050" y="276" text-anchor="middle" class="s muted">幅度 / 驱动</text>
  <text x="1050" y="377" text-anchor="middle" class="t">输出调理</text><text x="1050" y="404" text-anchor="middle" class="s muted">幅度 / 驱动</text>
  <path d="M954 256H991" class="line"/><path d="M954 384H991" class="line"/>
  <path d="M1107 256H1153" class="line"/><path d="M1107 384H1153" class="line"/>
  <text x="1127" y="239" class="t">A′</text><text x="1127" y="367" class="t">B′</text>
  <path d="M1122 256V185H419V268" class="feedback"/>
  <text x="660" y="177" text-anchor="middle" class="s" style="fill:#176b9b">A′反馈 · 与 C 中 fA 成分比较相位</text>
  <path d="M1122 384V472H419V368" class="feedback"/>
  <text x="734" y="500" text-anchor="middle" class="s" style="fill:#176b9b">B′反馈 · 与 C 中 fB 成分比较相位，并引入调相设置</text>
  <rect x="40" y="572" width="1120" height="68" rx="10" fill="#eaf3f8"/>
  <text x="62" y="600" class="t">识别 → 重建 → 交替反馈校正</text>
  <text x="62" y="625" class="s muted">LCD 显示波形与参数 · 按键 / 串口调相 · SYN6288 语音播报</text>
</svg>
