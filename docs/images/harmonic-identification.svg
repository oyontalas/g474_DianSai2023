<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">三倍频重叠与谐波判别流程</title>
  <desc id="desc">25 kHz 信号的三次谐波和 75 kHz 信号基波重叠。程序在三倍频组合下切换到五次谐波判断，否则使用三次谐波，并进行三轮多数判决。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536577"/></marker>
    <style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183044}.h{font-size:28px;font-weight:700}.t{font-size:20px;font-weight:600}.s{font-size:17px}.muted{fill:#536577}.line{fill:none;stroke:#536577;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#c9d5df;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="620" fill="#f7f9fb"/>
  <text x="40" y="52" class="h">难点：一个谱峰，可能来自两个不同成分</text>
  <text x="40" y="84" class="s muted">以 fA = 25 kHz、fB = 75 kHz 为例 · 位置示意，非实测频谱</text>
  <rect x="40" y="115" width="1120" height="188" rx="12" fill="#fff" stroke="#c9d5df"/>
  <rect x="505" y="130" width="170" height="146" rx="8" fill="#fff2dc"/>
  <text x="66" y="163" class="t">A 的奇次成分</text><text x="66" y="228" class="t">B 的基波</text>
  <path d="M292 171H1107" class="line"/><path d="M292 236H1107" class="line"/>
  <path d="M350 147V170M590 147V170M830 147V170M590 212V235" stroke="#176b9b" stroke-width="5"/>
  <text x="350" y="139" text-anchor="middle" class="s">基波</text>
  <text x="590" y="139" text-anchor="middle" class="s">三次谐波</text>
  <text x="830" y="139" text-anchor="middle" class="s">五次谐波</text>
  <text x="590" y="207" text-anchor="middle" class="s" style="fill:#945c00">与 A 的三次谐波重叠</text>
  <text x="350" y="268" text-anchor="middle" class="s muted">25</text><text x="590" y="268" text-anchor="middle" class="s muted">75</text><text x="830" y="268" text-anchor="middle" class="s muted">125</text>
  <text x="1050" y="268" text-anchor="middle" class="s muted">频率 / kHz</text>
  <rect x="40" y="358" width="210" height="92" rx="10" fill="#eaf3f8" stroke="#176b9b"/>
  <text x="145" y="393" text-anchor="middle" class="t">fB = 3 × fA ?</text><text x="145" y="424" text-anchor="middle" class="s muted">先判断频率关系</text>
  <rect x="340" y="330" width="380" height="84" rx="10" class="box"/>
  <text x="530" y="362" text-anchor="middle" class="t">三次谐波判别</text><text x="530" y="391" text-anchor="middle" class="s muted">H3 / H1 &gt; 2% → 本轮记为三角波</text>
  <rect x="340" y="446" width="380" height="84" rx="10" class="box"/>
  <text x="530" y="478" text-anchor="middle" class="t">五次谐波判别</text><text x="530" y="507" text-anchor="middle" class="s muted">H5 / H1 &gt; 1% → 本轮记为三角波</text>
  <path d="M250 386H286V372H338" class="line"/><text x="290" y="359" class="s">否</text>
  <path d="M250 422H286V488H338" class="line"/><text x="297" y="478" class="s">是</text>
  <rect x="824" y="370" width="336" height="120" rx="10" fill="#eaf3f8" stroke="#176b9b"/>
  <text x="992" y="404" text-anchor="middle" class="t">三轮统计 · 多数判决</text>
  <text x="992" y="435" text-anchor="middle" class="s">分别确定 A、B 波形</text><text x="992" y="465" text-anchor="middle" class="s">配置两片 AD9833</text>
  <path d="M720 372H770V401H822" class="line"/><path d="M720 488H770V457H822" class="line"/>
  <text x="40" y="579" class="s muted">说明：低于阈值记为正弦波；阈值取自当前源码。该特殊分支针对三倍频重叠。</text>
</svg>
